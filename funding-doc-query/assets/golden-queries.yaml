# 金标准问题集
#
# 两段式：
#   queries:       题目 + 判据（演练阶段只读这一段）
#   sealed_notes:  逐题答案依据（演练阶段禁止打开；阶段 4 才读）
#
# 出题基线：datas-md/by_topic，172 份 .md，扫描于 2026-11-02。
# 所有 expected / expected_paths / evidence_snippet 均来自真实产物，无编造样本。

meta:
  version: "1.0.0"
  corpus_snapshot: "2026-11-02"
  corpus_size: 172
  sealed_from_stage: 3

# ══════════════════════════════════════════════════════════════
# 题目段（演练可见）
# ══════════════════════════════════════════════════════════════
queries:

  - id: G1a
    question: "森国科的投后估值是多少？"
    question_type: point_query
    expected: "10.2亿元"
    expected_paths:
      - datas-md/by_topic/半导体/2022/BP/2022-05_BP_森国科SiC_v1.0.md
    evidence_layer: 原文证据
    evidence_snippet: "总股本2365万股 l 拟增发260万股 l 每股39元 l 融资金额1亿 l 投后估值10.2亿元"
    expected_flags: [multi_source, duplicate_present]
    allowed_variance: "单位可为「亿元」；数值必须为 10.2；轮次 D 轮须一并出现"
    notes: "该主体存在 duplicate_of，聚合/计数时只算一家"

  - id: G1b
    question: "卓远半导体 A 轮的投后估值是多少？"
    question_type: point_query
    expected: "6亿元"
    expected_paths:
      - datas-md/by_topic/半导体/2023/BP/2023-03-07_BP_卓远半导体_v1.0.md
    evidence_layer: 正文 + 原文证据
    evidence_snippet: "A轮融资：江苏双良节能领投，如皋东部跟投 投后估值6亿元 2021.8"
    expected_flags: [multi_round]
    allowed_variance: "数值必须为 6；单位亿元或亿均可"
    notes: "该文档融资历程含 A 轮 6亿元（2021.8）与 B 轮 16亿元（2022.12）两个估值，key_facts 只抽到 A 轮的 6亿元。必须区分轮次，直接答「投后估值 6亿元」而不指明轮次不通过"

  - id: G2
    question: "湖南艾凯瑞斯智能科技的总经理是谁？"
    question_type: body_deep
    expected: "龚胜"
    expected_paths:
      - datas-md/by_topic/半导体/2021/BP/2021-06-18_BP_湖南艾凯瑞斯智能科技_v1.0.md
    evidence_layer: 正文
    evidence_snippet: "胡天 技术总监\n龚胜 总经理"
    expected_flags: [body_only]
    allowed_variance: "只要求姓名「龚胜」；职务必须为「总经理」"
    notes: "「龚胜」全库仅出现 1 次，且在正文；key_facts/summary 均不含。P1 必然落空，只有 P2 能命中"

  - id: G3a
    question: "新材料赛道有哪些文档，主体分别是谁？"
    question_type: aggregation
    expected: "5 份：欣奕华打造先进材料领域世界领先企业、阜阳欣奕、中熵科技项目、光之科技、晶名光电公司情况介绍"
    expected_paths:
      - datas-md/by_topic/新材料/2022/BP/2022-05_BP_欣奕华打造先进材料领域世界领先企业_v1.0.md
      - datas-md/by_topic/新材料/2022/BP/2022-05_BP_阜阳欣奕_v1.0.md
      - datas-md/by_topic/新材料/2023/BP/2023-03-13_BP_中熵科技项目_v1.0.md
      - datas-md/by_topic/新材料/2023/BP/2023-04-24_BP_光之科技_v1.0.md
      - datas-md/by_topic/新材料/2023/BP/2023-04-26_BP_晶名光电公司情况介绍_v1.0.md
    evidence_layer: 元数据
    evidence_snippet: "glob 命中 5 份，全部实读（5 ≤ 8）"
    expected_flags: [complete_coverage]
    allowed_variance: "顺序不限；5 份必须全中，少一份即不通过"
    notes: "5 份可在单轮 read 预算内全部读，覆盖报告须声明「命中 5 实读 5，无未纳入」"

  - id: G3b
