    question_type: aggregation
    expected: "11 份"
    expected_paths:
      - datas-md/by_topic/半导体/2022/WHITEPAPER/
      - datas-md/by_topic/半导体/2023/WHITEPAPER/
      - datas-md/by_topic/半导体/2024/WHITEPAPER/
    evidence_layer: 路径计数
    evidence_snippet: "glob(\"datas-md/by_topic/**/WHITEPAPER/*.md\") → 11"
    expected_flags: [count_only]
    allowed_variance: "数量必须为 11"
    notes: "路径级断言：三个目录下的文件总数须为 11；不要求逐一 read"

  - id: G4
    question: "云潼科技的融资轮次在不同文档里是怎么变化的？"
    question_type: time_evolution
    expected: "两份 BP 轮次不同：2022-08 的《重庆云潼科技》为「天使轮」，2022-11 的《云潼科技》为「C轮」。两份 subject 与注册地不同"
    expected_paths:
      - datas-md/by_topic/半导体/2022/BP/2022-08_BP_重庆云潼科技_v1.0.md
      - datas-md/by_topic/半导体/2022/BP/2022-11_BP_云潼科技_v1.0.md
    evidence_layer: 关键事实
    evidence_snippet: "轮次: 天使轮 / 轮次: C轮"
    expected_flags: [multi_source, subject_name_differs]
    allowed_variance: "两轮次、两日期必须；不得合并成单一结论"
    notes: "两份 entity_key 同为 云潼科技，但 alias_full 分别为「重庆云潼科技有限公司」「深圳云潼科技有限公司」，须提示主体存疑"

