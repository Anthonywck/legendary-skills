    question: "半导体光刻胶的国产化率是多少？"
    question_type: conflict
    expected: "库内至少三个不同值，统计对象不同：(1) 2018 年达到 58%；(2) 2020 年中国大陆 IC 光刻胶国产化率仅 5.6%；(3) 2022 年光刻胶（与掩模版合并口径）国产化率在 10% 以下"
    expected_paths:
