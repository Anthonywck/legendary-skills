  新材料:
    desc: 非半导体口径的功能材料、结构材料、制热/导热材料
  新能源:
    desc: 锂电、光伏、储能、电池管理系统、新能源车零部件
  企业服务:
    desc: 不归属于某一实体产业、以服务/软件/咨询为主业的企业
