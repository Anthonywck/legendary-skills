# ---------------------------------------------------------------------------
# 关键词规则：无方括号或方括号未登记时，按顺序匹配（filename + 首页标题）
# 命中第一条即停 —— 顺序即优先级，禁止乱序
# ---------------------------------------------------------------------------
keyword_rules:
  - topic: 半导体
    tags: [半导体]
    any_of: [半导体, 芯片, SiC, 碳化硅, 氮化镓, 集成电路, 晶圆, 封测, 存储, Chiplet, 光刻, IGBT, MOSFET, GaN, 氧化镓, 衬底, 外延, 量检测, 键合]
  - topic: 新能源
    tags: [新能源]
    any_of: [锂电, 光伏, 储能, 充电桩, 电池]
  - topic: 新材料
    tags: [新材料]
    any_of: [新材料, 陶瓷基板, 复合材料, 薄膜, 粉体, 坩埚, 晶体]
  - topic: 节能环保
    tags: [节能环保]
    any_of: [环保, 节能, 取水, 回收, 碳中和, 低碳]
  - topic: 企业服务
    tags: [企业服务]
    any_of: [数字化转型, 咨询, 供应链服务, 人才, 薪酬]

# ---------------------------------------------------------------------------
# 文档类型枚举
# 判定用 source_root + 文件名特征，顺序匹配
# ---------------------------------------------------------------------------
doc_types:
  BP:         {desc: 商业计划书}
  REPORT:     {desc: 行业/券商研究报告}
  WHITEPAPER: {desc: 白皮书 / 手册}
  DOC:        {desc: 技术文档、方案、说明等（非投融资正式材料）}
  NOTE:       {desc: 笔记 / 备忘（.md 等轻量文本）}
  SHEET:      {desc: 表格数据（.csv / .tsv / .xlsx）}
  OTHER:      {desc: 未归类，需人工确认}

# 规则按顺序匹配，第一条命中即停 —— 顺序即优先级，禁止乱序。
# source_root 用「包含」匹配，因此 `商业计划书`、`商业计划书-2024` 都能命中。
doc_type_rules:
  # 1) 明确的弱信号优先于目录名：白皮书/手册不一定是报告
  - doc_type: WHITEPAPER
    when: {name_contains_any: [白皮书, 手册, whitepaper]}
  # 2) 商业计划书类目录
  - doc_type: BP
    when: {source_root: 商业计划书}
  # 3) 报告类目录
  - doc_type: REPORT
    when: {source_root: 行业报告}
  # 4) 目录名里带「报告/研报」也算
  - doc_type: REPORT
    when: {source_root: 报告}
  # 5) 文件名自述是商业计划书
  - doc_type: BP
    when: {name_contains_any: [商业计划书, 融资计划书, 项目BP, business plan]}
  # 6) 表格类：结构化数据，既不是报告也不是技术文档
  - doc_type: SHEET
    when: {ext_any: [.csv, .tsv, .xlsx]}
  # 7) Markdown 属于轻量笔记
  - doc_type: NOTE
    when: {ext_any: [.md, .markdown]}
  # 8) 其余归为技术/方案文档，而不是「其他」——
  #    「方案/说明/教程」这类在真实数据里很常见，混进 OTHER 会让复核清单失真
  - doc_type: DOC
    when: {name_contains_any: [方案, 说明, 教程, 指南, 接入, 安装, 部署]}

# 全部规则都未命中时的兜底
default_doc_type: OTHER

# ---------------------------------------------------------------------------
# 路径模板
# by_topic/{topic}/{year}/{doc_type}/{date}_{DOC_TYPE}_{subject}_{version}[_{status}].md
# ---------------------------------------------------------------------------
path_template: "by_topic/{topic}/{year}/{doc_type}/{date}_{DOC_TYPE}_{subject}_{version}{status_suffix}.md"
unknown_year: unknown
unknown_date: unknown
unknown_subject: unknown
default_version: v1.0
